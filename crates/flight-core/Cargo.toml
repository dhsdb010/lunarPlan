[package]
name = "flight-core"
version = "0.1.0"
edition = "2021"
description = "lunarPlan deterministic Apollo LM landing sim (P66 Final Approach), shared by browser and verifier"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
